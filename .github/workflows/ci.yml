name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # A lockfile is not bundled because npm registry access was unavailable
      # during packaging. Commit package-lock.json after an audited install,
      # then switch this step to `npm ci` for reproducible dependency installs.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate repository and server source
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Build production frontend
        run: npm run build
